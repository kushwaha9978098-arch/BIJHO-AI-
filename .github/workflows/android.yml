name: Build BIJHO AI APK

on:
workflow_dispatch:
push:
paths:
- ".github/app/**"
- ".github/workflows/android.yml"
- ".github/build.gradle"
- ".github/settings.gradle"

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Check Android project files
    run: |
      test -f .github/settings.gradle
      test -f .github/build.gradle
      test -f .github/app/build.gradle
      test -f .github/app/app/src/main/AndroidManifest.xml
      echo "Android project files found."

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: |
      sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Build debug APK
    working-directory: .github
    run: gradle :app:assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: BIJHO-AI-APK
      path: .github/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
